# VERSION: BASE-REF-v1  (this copy lives on main / the PR base ref)
# If a manifest compiler reads this file, it MUST see BASE-REF-v1.
rules:
  - position: 0
    name: catch-all
    patterns: ["**"]
    action: review
    composition: base-ref-composition
  - position: 1
    name: skip-lockfiles
    patterns: ["**/package-lock.json"]
    action: skip
